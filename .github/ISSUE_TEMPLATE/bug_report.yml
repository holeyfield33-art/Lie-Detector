name: 🐛 Bug Report
description: Report a bug to help us improve Readme-Tester
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of the tool are you using? (e.g., v1.0.1)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Tell us exactly how you ran the tool.
      placeholder: |
        1. Create a README with an invalid command
        2. Run 'python readme_tester.py...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
